services:
  postgres:
    image: postgres:16-alpine
    container_name: openksef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: openksef
    # Creates the keycloak database on first init (no local file mount needed)
    entrypoint:
      - sh
      - -c
      - |
        echo "CREATE DATABASE keycloak;" > /docker-entrypoint-initdb.d/01-keycloak.sql
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: ghcr.io/open-ksef/openksef-keycloak:${OPENKSEF_VERSION:-latest}
    container_name: openksef-keycloak
    restart: unless-stopped
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${POSTGRES_USER}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-${POSTGRES_PASSWORD}}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}

      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"

  api:
    image: ghcr.io/open-ksef/openksef-api:${OPENKSEF_VERSION:-latest}
    container_name: openksef-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__RequireHttpsMetadata: "false"
      ASPNETCORE_URLS: http://0.0.0.0:8081
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=openksef;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Auth__Authority: http://keycloak:8080/auth/realms/openksef
      Auth__PublicAuthority: ${APP_EXTERNAL_BASE_URL:-http://localhost:8080}/auth/realms/openksef
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Existing installation: do not generate a key, follow docs/admin-setup.md. New installation: openssl rand -base64 32}"
      Auth__ServiceAccount__ClientId: openksef-api
      Auth__ServiceAccount__ClientSecret: ${API_CLIENT_SECRET:-}
      KSeF__BaseUrl: ${KSEF_BASE_URL:-test}
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
      ForwardedHeaders__ForwardLimit: ${FORWARD_LIMIT:-1}
      ForwardedHeaders__KnownNetworks: ${TRUSTED_PROXY_NETWORKS:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@openksef.local}
      Email__FromName: ${EMAIL_FROM_NAME:-OpenKSeF}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    image: ghcr.io/open-ksef/openksef-worker:${OPENKSEF_VERSION:-latest}
    container_name: openksef-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=openksef;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Auth__Authority: http://keycloak:8080/auth/realms/openksef
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Existing installation: do not generate a key, follow docs/admin-setup.md. New installation: openssl rand -base64 32}"
      KSeF__BaseUrl: ${KSEF_BASE_URL:-test}
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@openksef.local}
      Email__FromName: ${EMAIL_FROM_NAME:-OpenKSeF}

  portal-web:
    image: ghcr.io/open-ksef/openksef-portal-web:${OPENKSEF_VERSION:-latest}
    container_name: openksef-portal-web
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
    environment:
      VITE_API_BASE_URL: /api
      VITE_AUTH_AUTHORITY: /auth/realms/openksef
      VITE_AUTH_CLIENT_ID: openksef-portal-web

  gateway:
    image: ghcr.io/open-ksef/openksef-gateway:${OPENKSEF_VERSION:-latest}
    container_name: openksef-gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      portal-web:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN_ALLOW: ${KEYCLOAK_ADMIN_ALLOW:-}
      APP_EXTERNAL_BASE_URL: ${APP_EXTERNAL_BASE_URL:-}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
