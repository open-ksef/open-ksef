name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# One release at a time across all tags, so :latest writes never interleave
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # 0. Same jobs as CI, including integration tests.
  #    docker-dev inside it is skipped on tags, but its
  #    packages: write must be allowed here or the called
  #    workflow fails to start.
  # ─────────────────────────────────────────────
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ─────────────────────────────────────────────
  # 1. Create draft GitHub Release
  # ─────────────────────────────────────────────
  create-release:
    name: Create Draft Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: OpenKSeF ${{ github.ref_name }}
          body: |
            ## OpenKSeF ${{ github.ref_name }}

            ### Docker (self-hosting)

            Existing installation: check `ENCRYPTION_KEY` and follow the [upgrade procedure](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/admin-setup.md#upgrade-from-v007-or-earlier) before you run anything. New installation: set `ENCRYPTION_KEY` in `.env` first.

            This release no longer reads the encryption key from the database. An installation that still holds it there (step 1 of the upgrade procedure returns 1) must set `ENCRYPTION_KEY` before it upgrades. Without it, API and Worker refuse to start and change nothing.

            Download `docker-compose.yml` attached below and run:

            ```bash
            docker compose up -d
            ```

            The attached compose pins every image to `${{ github.ref_name }}`; set `OPENKSEF_VERSION` in `.env` to run another release.

            Upgrade from a compose that published ports 5432, 8081, 8082 or 8083: only the gateway port (`APP_HOST_PORT`, default 8080) is published now, and the gateway answers 403 on `/auth/admin` unless `KEYCLOAK_ADMIN_ALLOW` is set. Read [Upgrade: ports and Keycloak admin](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/admin-setup.md#upgrade-ports-and-keycloak-admin) before you pull: it shows how to reach Postgres and the Keycloak admin console (SSH tunnel or allow-list).

            Images pushed to GHCR:
            - `ghcr.io/${{ github.repository_owner }}/openksef-api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-worker:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-portal-web:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-push-relay:${{ github.ref_name }}` (team-hosted relay, `docker-compose.push-relay.yml`)

            ---

  # ─────────────────────────────────────────────
  # 2. Docker images → GHCR
  # ─────────────────────────────────────────────
  docker:
    name: Docker → GHCR
    needs: [test, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-api:${{ github.ref_name }}
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-worker:${{ github.ref_name }}
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Portal Web
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Portal.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-portal-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./infra/nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Push Relay
        uses: docker/build-push-action@v6
        with:
          context: ./src/OpenKSeF.PushRelay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-push-relay:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin docker-compose.yml to this release
        run: |
          sed -i "s/\${OPENKSEF_VERSION:-latest}/\${OPENKSEF_VERSION:-$GITHUB_REF_NAME}/" docker-compose.yml
          if grep -n 'latest' docker-compose.yml; then exit 1; fi
          POSTGRES_USER=x POSTGRES_PASSWORD=x KEYCLOAK_ADMIN=x KEYCLOAK_ADMIN_PASSWORD=x ENCRYPTION_KEY=x docker compose -f docker-compose.yml config -q

      - name: Attach docker-compose.yml to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: docker-compose.yml

      - name: Move :latest to this release
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in api worker portal-web gateway push-relay; do
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER/openksef-$image:latest" \
              "ghcr.io/$OWNER/openksef-$image:$GITHUB_REF_NAME"
          done

  # ─────────────────────────────────────────────
  # 3. Publish release (remove draft) once all jobs done
  # ─────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
