name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# One release at a time across all tags, so :latest writes never interleave
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # 0. Same jobs as CI, including integration tests.
  #    docker-dev inside it is skipped on tags, but its
  #    packages: write must be allowed here or the called
  #    workflow fails to start.
  # ─────────────────────────────────────────────
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ─────────────────────────────────────────────
  # 1. Create draft GitHub Release
  # ─────────────────────────────────────────────
  create-release:
    name: Create Draft Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: OpenKSeF ${{ github.ref_name }}
          body: |
            ## OpenKSeF ${{ github.ref_name }}

            ### Docker (self-hosting)

            Existing installation: check `ENCRYPTION_KEY` and follow the [upgrade procedure](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/admin-setup.md#upgrade-from-v007-or-earlier) before you run anything. New installation: set `ENCRYPTION_KEY` in `.env` first.

            Download `docker-compose.yml` attached below and run:

            ```bash
            docker compose up -d
            ```

            Images pushed to GHCR:
            - `ghcr.io/${{ github.repository_owner }}/openksef-api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-worker:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-portal-web:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/openksef-gateway:${{ github.ref_name }}`

            ---

  # ─────────────────────────────────────────────
  # 2. Docker images → GHCR
  # ─────────────────────────────────────────────
  docker:
    name: Docker → GHCR
    needs: [test, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-api:${{ github.ref_name }}
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-worker:${{ github.ref_name }}
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Portal Web
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OpenKSeF.Portal.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-portal-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./infra/nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-gateway:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach docker-compose.yml to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: docker-compose.yml

      - name: Move :latest to this release
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in api worker portal-web gateway; do
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER/openksef-$image:latest" \
              "ghcr.io/$OWNER/openksef-$image:$GITHUB_REF_NAME"
          done

  # ─────────────────────────────────────────────
  # 3. Publish release (remove draft) once all jobs done
  # ─────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
