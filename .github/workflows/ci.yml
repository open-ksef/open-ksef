name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Configure CIRFMF NuGet feed
        run: |
          dotnet nuget update source CIRFMF \
            --source https://nuget.pkg.github.com/CIRFMF/index.json \
            --username ${{ github.actor }} \
            --password ${{ secrets.NUGET_CIRFMF_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Verify NuGet source mapping
        run: ../scripts/verify-nuget-source-mapping.sh

      - name: Restore
        run: |
          dotnet restore OpenKSeF.Api/OpenKSeF.Api.csproj
          dotnet restore OpenKSeF.Worker/OpenKSeF.Worker.csproj
          dotnet restore OpenKSeF.PushRelay/OpenKSeF.PushRelay.csproj
          dotnet restore OpenKSeF.Domain/OpenKSeF.Domain.csproj
          dotnet restore OpenKSeF.Domain.Tests/OpenKSeF.Domain.Tests.csproj
          dotnet restore OpenKSeF.Api.Tests/OpenKSeF.Api.Tests.csproj
          dotnet restore OpenKSeF.PushRelay.Tests/OpenKSeF.PushRelay.Tests.csproj
          dotnet restore OpenKSeF.Api.IntegrationTests/OpenKSeF.Api.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build OpenKSeF.Api/OpenKSeF.Api.csproj --no-restore -c Release
          dotnet build OpenKSeF.Worker/OpenKSeF.Worker.csproj --no-restore -c Release
          dotnet build OpenKSeF.PushRelay/OpenKSeF.PushRelay.csproj --no-restore -c Release
          dotnet build OpenKSeF.Domain.Tests/OpenKSeF.Domain.Tests.csproj --no-restore -c Release
          dotnet build OpenKSeF.Api.Tests/OpenKSeF.Api.Tests.csproj --no-restore -c Release
          dotnet build OpenKSeF.PushRelay.Tests/OpenKSeF.PushRelay.Tests.csproj --no-restore -c Release
          dotnet build OpenKSeF.Api.IntegrationTests/OpenKSeF.Api.IntegrationTests.csproj --no-restore -c Release

      - name: Test
        run: |
          dotnet test OpenKSeF.Domain.Tests/OpenKSeF.Domain.Tests.csproj --no-build -c Release --verbosity normal
          dotnet test OpenKSeF.Api.Tests/OpenKSeF.Api.Tests.csproj --no-build -c Release --verbosity normal
          dotnet test OpenKSeF.PushRelay.Tests/OpenKSeF.PushRelay.Tests.csproj --no-build -c Release --verbosity normal

      - name: Integration test
        timeout-minutes: 20
        run: dotnet test OpenKSeF.Api.IntegrationTests/OpenKSeF.Api.IntegrationTests.csproj --no-build -c Release --verbosity normal

  portal-web:
    name: Build & Lint (Portal Web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/OpenKSeF.Portal.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/OpenKSeF.Portal.Web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  gateway:
    name: Gateway nginx config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build gateway image
        run: docker build -q -t openksef-gateway:ci infra/nginx

      - name: nginx -t
        run: docker run --rm openksef-gateway:ci nginx -t

      - name: X-Forwarded-Prefix cleared
        run: docker run --rm openksef-gateway:ci nginx -T | grep -q 'proxy_set_header X-Forwarded-Prefix "";'

      - name: 2 MB POST returns JSON 413
        run: |
          docker run -d --name gateway -p 8080:8080 openksef-gateway:ci
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
          head -c 2097152 /dev/zero > body.bin
          result=$(curl -s -D headers.txt -o out.json -w '%{http_code} %{content_type}' -X POST --data-binary @body.bin http://localhost:8080/api/tenants)
          echo "$result"; cat headers.txt out.json
          test "$result" = "413 application/json; charset=utf-8"
          test "$(cat out.json)" = '{"error":"Żądanie jest za duże."}'
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^content-security-policy:' headers.txt

  keycloak:
    name: Keycloak theme image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build Keycloak image
        run: docker build -q --build-context portal=src/OpenKSeF.Portal.Web -t openksef-keycloak:ci infra/keycloak

      - name: Theme is in the image
        run: docker run --rm --entrypoint ls openksef-keycloak:ci /opt/keycloak/themes/openksef/login/theme.properties /opt/keycloak/themes/openksef/login/resources/css/ui.css

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/OpenKSeF.Portal.Web/package-lock.json

      - name: Install portal packages
        working-directory: src/OpenKSeF.Portal.Web
        run: npm ci

      - name: Render test
        timeout-minutes: 20
        env:
          BROWSER_CHANNEL: chrome
        run: node infra/keycloak/render-test/render.mjs openksef-keycloak:ci render-out

      - name: Upload render shots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-render
          path: render-out

  # ─────────────────────────────────────────────────────────────────
  # Push :dev images to GHCR on every commit to main.
  # Gateway infra image is only rebuilt when its source files change.
  # ─────────────────────────────────────────────────────────────────
  docker-dev:
    name: Docker :dev images
    needs: [backend, portal-web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Detect infra file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            nginx:
              - 'infra/nginx/**'
            keycloak:
              - 'infra/keycloak/**'
              - 'src/OpenKSeF.Portal.Web/src/index.css'
              - 'src/OpenKSeF.Portal.Web/src/components/ui.css'
              - 'src/OpenKSeF.Portal.Web/src/components/auth.css'
              - 'src/OpenKSeF.Portal.Web/src/assets/fonts/**'
              - 'src/OpenKSeF.Portal.Web/public/**'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push API :dev
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/OpenKSeF.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-api:dev
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Worker :dev
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/OpenKSeF.Worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-worker:dev
          secrets: |
            nuget_cirfmf_pat=${{ secrets.NUGET_CIRFMF_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Portal Web :dev
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/OpenKSeF.Portal.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-portal-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Push Relay :dev
        uses: docker/build-push-action@v7
        with:
          context: ./src/OpenKSeF.PushRelay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-push-relay:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Gateway :dev
        if: steps.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./infra/nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-gateway:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Keycloak :dev
        if: steps.changes.outputs.keycloak == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./infra/keycloak
          build-contexts: |
            portal=./src/OpenKSeF.Portal.Web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openksef-keycloak:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
