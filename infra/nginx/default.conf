map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $header_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 41-external-scheme.sh pins the scheme from APP_EXTERNAL_BASE_URL: NPM passes a client's X-Forwarded-Proto through.
map $pinned_proto $x_fwd_proto {
    ''      $header_proto;
    default $pinned_proto;
}

map $http_x_forwarded_proto $xfp_https {
    https   1;
    default "";
}

map $x_fwd_proto $proto_port {
    https   443;
    default 80;
}

# Client X-Forwarded-Host/-Port/-Prefix are never forwarded: a proxy passes them through and Keycloak would issue for a forged host.
# Host and port come from the Host header, which the proxy routes on; the listen port 8080 is internal.
map $http_host $x_fwd_port {
    "~:(?<port>[0-9]+)$" $port;
    default              $proto_port;
}

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $pinned_proto "";
    include /etc/nginx/external-scheme*.conf;

    set $api_upstream http://api:8081;
    set $keycloak_upstream http://keycloak:8080;
    set $portal_web_upstream http://portal-web:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $x_fwd_port;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Security headers (applied to all responses)
    # HSTS is intentionally omitted: this server listens on HTTP.
    # Add HSTS at the TLS-terminating layer if you add HTTPS to nginx.
    add_header X-Content-Type-Options   "nosniff"                              always;
    add_header X-Frame-Options          "SAMEORIGIN"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    error_page 413 @too_large;

    location @too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":"Żądanie jest za duże."}';
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # add_header here replaces the server-level set: Keycloak sends its own CSP and X-Frame-Options.
    location /auth/ {
        add_header X-Content-Type-Options   "nosniff"                              always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        proxy_pass $keycloak_upstream;
    }

    # KEYCLOAK_ADMIN_ALLOW becomes allow lines in admin-allow*.conf; the glob keeps a gateway without the file at deny all.
    location /auth/admin {
        include /etc/nginx/admin-allow*.conf;
        deny all;
        add_header X-Content-Type-Options   "nosniff"                              always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        proxy_pass $keycloak_upstream;
    }

    location / {
        proxy_pass $portal_web_upstream;
    }
}
